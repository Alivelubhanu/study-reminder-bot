name: Study Reminder Bot

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST - DevOps WhatsApp
    - cron: '45 1 * * *'   # 7:15 AM IST - DevOps Call
    - cron: '30 4 * * *'   # 10:00 AM IST - Python WhatsApp
    - cron: '45 4 * * *'   # 10:15 AM IST - Python Call
    - cron: '30 8 * * *'   # 2:00 PM IST - SQL WhatsApp
    - cron: '45 8 * * *'   # 2:15 PM IST - SQL Call
    - cron: '30 13 * * *'  # 7:00 PM IST - Evening WhatsApp
    - cron: '45 13 * * *'  # 7:15 PM IST - Evening Call
    - cron: '46 14 * * *'   # TEST CALL NOW
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install twilio

      - name: DevOps WhatsApp (7:00 AM)
        if: github.event.schedule == '30 1 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py DevOps

      - name: DevOps Call (7:15 AM)
        if: github.event.schedule == '45 1 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py call-DevOps

      - name: Python WhatsApp (10:00 AM)
        if: github.event.schedule == '30 4 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py Python

      - name: Python Call (10:15 AM)
        if: github.event.schedule == '45 4 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py call-Python

      - name: SQL WhatsApp (2:00 PM)
        if: github.event.schedule == '30 8 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py SQL

      - name: SQL Call (2:15 PM)
        if: github.event.schedule == '45 8 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py call-SQL

      - name: Evening WhatsApp (7:00 PM)
        if: github.event.schedule == '30 13 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py Evening

      - name: Evening Call (7:15 PM)
        if: github.event.schedule == '45 13 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py call-Evening

      - name: TEST CALL NOW
        if: github.event.schedule == '33 14 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_reminder.py call-DevOps
