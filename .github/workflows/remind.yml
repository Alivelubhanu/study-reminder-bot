name: Study Reminder Bot

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (1:30 AM UTC)
    - cron: '30 4 * * *'  # 10:00 AM IST (4:30 AM UTC)
    - cron: '30 8 * * *'  # 2:00 PM IST (8:30 AM UTC)
    - cron: '30 13 * * *' # 7:00 PM IST (1:30 PM UTC)
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install twilio

      - name: Send DevOps reminder (7 AM)
        if: github.event.schedule == '30 1 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python send_reminder.py DevOps

      - name: Send Python reminder (10 AM)
        if: github.event.schedule == '30 4 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python send_reminder.py Python

      - name: Send SQL reminder (2 PM)
        if: github.event.schedule == '30 8 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python send_reminder.py SQL

      - name: Send Evening revision (7 PM)
        if: github.event.schedule == '30 13 * * *'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python send_reminder.py Evening
